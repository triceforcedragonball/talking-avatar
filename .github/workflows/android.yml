name: Build Web APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Website to APK Action
        uses: darkshredder/web-to-app-action@v1
        with:
          app-name: "MyTalkingAvatarApp"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk/
