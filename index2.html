<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talking Avatar</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#151515;color:#fff;font-family:system-ui,sans-serif;text-align:center;display:flex;flex-direction:column;min-height:100vh}
  main{max-width:520px;width:100%;margin:auto;padding:12px 14px 24px;display:flex;flex-direction:column;flex:1}
  h1{margin:4px 0 2px;font-size:22px}
  p.subtitle{color:#bbb;margin:0 0 10px;font-size:14px}
  
  /* Stage area scales gracefully and hosts stationary background */
  .stage{flex:1;min-height:260px;max-height:70vh;background:#252525;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:8px 0;position:relative}
  
  /* Stationary background layer */
  #stage-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:1;display:none}
  
  /* Avatar container sits above background and handles animations safely */
  #avatar-container{display:inline-block;max-width:100%;max-height:100%;transform-origin:center bottom;position:relative;z-index:2}
  #avatar{max-width:100%;max-height:100%;object-fit:contain;display:block}
  #placeholder{color:#777;padding:20px;font-size:14px;position:relative;z-index:2}

  /* Animation Keyframes */
  @keyframes regularBounceAnim {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(var(--anim-intensity, -10px)); }
  }
  @keyframes excitedBounceAnim {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(var(--anim-intensity, -30px)); }
  }
  @keyframes swayAnim {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(calc(var(--anim-intensity, 6deg) * -1)); }
    75% { transform: rotate(var(--anim-intensity, 6deg)); }
  }
  @keyframes tiltAnim {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(var(--anim-intensity, 8deg)); }
  }
  @keyframes pulseAnim {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(var(--anim-intensity, 1.08)); }
  }
  @keyframes floatAnim {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(calc(var(--anim-intensity, 15px) * -1)); }
  }

  .anim-regular-bounce { animation: regularBounceAnim 0.8s ease-in-out infinite; }
  .anim-excited-bounce { animation: excitedBounceAnim 0.35s ease-in-out infinite; }
  .anim-sway { animation: swayAnim 2s ease-in-out infinite; }
  .anim-tilt { animation: tiltAnim 1.5s ease-in-out infinite; }
  .anim-pulse { animation: pulseAnim 1.2s ease-in-out infinite; }
  .anim-float { animation: floatAnim 3s ease-in-out infinite; }

  /* Mode toggle bar */
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  
  /* Collapsible settings panel for Avatar-only mode */
  #controlsPanel{transition:all 0.3s ease}
  .hidden-mode #controlsPanel{display:none}
  .hidden-mode main{max-width:100%;padding:4px;height:100vh;justify-content:center}
  .hidden-mode .top-bar, .hidden-mode h1, .hidden-mode p.subtitle{display:none}
  .hidden-mode .stage{min-height:90vh;max-height:98vh;margin:0;border-radius:10px}
  .hidden-mode #floatingToggle{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;z-index:10;cursor:pointer}

  button,input,select{font:inherit}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;font-size:13px}
  .primary{background:#fff;color:#111}
  .dark{background:#333;color:#fff}
  .danger{background:#5a2323;color:#ff9999}
  
  select{width:100%;padding:10px;border-radius:10px;background:#222;color:#fff;border:1px solid #444;font-weight:700;font-size:13px}
  
  .slots-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .slot-card{background:#1e1e1e;padding:8px;border-radius:10px;border:1px solid #333;text-align:left}
  .slot-card label{font-size:11px;color:#aaa;display:block;margin-bottom:4px;font-weight:bold}
  .slot-actions{display:flex;gap:4px}
  .slot-actions button{padding:6px 8px;font-size:11px;flex:1;border-radius:6px}

  .meter{height:14px;background:#303030;border-radius:7px;overflow:hidden;margin:6px 0}
  #bar{height:100%;width:0%;background:#63df83;transition:width .05s}
  #status{font-weight:800;color:#ccc;margin:4px;font-size:13px}
  
  label.range-label{display:block;color:#bbb;margin-top:8px;font-size:13px;text-align:left}
  input[type=range]{width:100%;margin:4px 0}
  .note{font-size:11px;color:#888;margin-top:8px;line-height:1.3}
  
  .actions-section{background:#1a1a1a;padding:8px;border-radius:12px;margin:8px 0;border:1px solid #2a2a2a}
</style>
</head>
<body>
<main id="appMain">
  <div class="top-bar">
    <div>
      <h1>🎙️ Talking Avatar</h1>
      <p class="subtitle">Four-frame responsive mode</p>
    </div>
    <button class="dark" id="modeToggleBtn">📱 Avatar Mode</button>
  </div>

  <div class="stage">
    <div id="stage-bg"></div>
    <div id="floatingToggle" style="display:none">⚙️ Setup</div>
    <div id="avatar-container">
      <img id="avatar" alt="Avatar" style="display:none">
      <div id="placeholder">Load your 4 avatar states and background below. Images persist automatically via browser storage.</div>
    </div>
  </div>

  <div id="controlsPanel">
    <button class="primary" id="start" style="width:100%;padding:12px;font-size:15px;margin-bottom:6px">START MICROPHONE</button>
    <div class="meter"><div id="bar"></div></div>
    <div id="status">Stopped</div>

    <label class="range-label">Microphone Sensitivity</label>
    <input id="sensitivity" type="range" min="1" max="100" value="25">

    <label class="range-label">Blink Frequency (Speed/Rate)</label>
    <input id="blinkSpeed" type="range" min="1" max="100" value="50">

    <!-- Single Action Menu & Intensity Slider Section -->
    <div class="actions-section">
      <p style="margin:0 0 6px 0;font-size:12px;color:#888;font-weight:bold;text-align:left">AVATAR ACTION SELECTOR</p>
      
      <select id="actionSelect">
        <option value="none">✨ No Active Action</option>
        <option value="anim-regular-bounce">🟢 Regular Bounce</option>
        <option value="anim-excited-bounce">🎉 Excited Bounce</option>
        <option value="anim-sway">🔄 Side Sway</option>
        <option value="anim-tilt">📐 Head Tilt</option>
        <option value="anim-pulse">💓 Pulse Zoom</option>
        <option value="anim-float">🎈 Floating Hover</option>
      </select>

      <label class="range-label" id="intensityLabel">Action Intensity</label>
      <input id="actionIntensity" type="range" min="2" max="50" value="10">
    </div>

    <div class="slots-grid">
      <!-- Slot 1 -->
      <div class="slot-card">
        <label>1. Eyes Open / Closed Mouth</label>
        <div class="slot-actions">
          <button class="dark" onclick="triggerUpload('slot1')">Load</button>
          <button class="danger" onclick="clearSlot('slot1')">Remove</button>
        </div>
      </div>
      <!-- Slot 2 -->
      <div class="slot-card">
        <label>2. Eyes Open / Open Mouth</label>
        <div class="slot-actions">
          <button class="dark" onclick="triggerUpload('slot2')">Load</button>
          <button class="danger" onclick="clearSlot('slot2')">Remove</button>
        </div>
      </div>
      <!-- Slot 3 -->
      <div class="slot-card">
        <label>3. Eyes Closed / Closed Mouth</label>
        <div class="slot-actions">
          <button class="dark" onclick="triggerUpload('slot3')">Load</button>
          <button class="danger" onclick="clearSlot('slot3')">Remove</button>
        </div>
      </div>
      <!-- Slot 4 -->
      <div class="slot-card">
        <label>4. Eyes Closed / Open Mouth</label>
        <div class="slot-actions">
          <button class="dark" onclick="triggerUpload('slot4')">Load</button>
          <button class="danger" onclick="clearSlot('slot4')">Remove</button>
        </div>
      </div>
    </div>

    <!-- Background Slot Card -->
    <div class="slot-card" style="margin-top:6px;width:100%">
      <label>🖼️ Custom Stage Background</label>
      <div class="slot-actions">
        <button class="dark" onclick="triggerUpload('bg')">Load Background</button>
        <button class="danger" onclick="clearSlot('bg')">Remove Background</button>
      </div>
    </div>

    <div class="row" style="margin-top:8px">
      <button class="danger" id="clearAllBtn" style="font-size:11px;padding:6px 10px">Clear All Saved Images & Background</button>
    </div>

    <input id="fileInput" type="file" accept="image/*" hidden>

    <div class="note">
      Persistent storage enabled (IndexedDB). Optimized for mobile split-screen & foldables.
    </div>
  </div>
</main>

<script>
// State architecture for 4 avatar frames + background
const images = { slot1: null, slot2: null, slot3: null, slot4: null, bg: null };
let activeUploadSlot = null;

// Audio & Animation runtime states
let audioContext=null, analyser=null, data=null, stream=null, running=false;
let threshold=.035;
let isTalking = false;
let isBlinking = false;
let blinkTimeout = null;
let blinkMultiplier = 1.0;
let currentActiveAction = 'none';

// DOM Elements
const avatar=document.getElementById('avatar');
const avatarContainer=document.getElementById('avatar-container');
const stageBg=document.getElementById('stage-bg');
const placeholder=document.getElementById('placeholder');
const bar=document.getElementById('bar');
const status=document.getElementById('status');
const start=document.getElementById('start');
const fileInput=document.getElementById('fileInput');
const appMain=document.getElementById('appMain');
const modeToggleBtn=document.getElementById('modeToggleBtn');
const floatingToggle=document.getElementById('floatingToggle');

// Dropdown & Intensity Controls
const actionSelect = document.getElementById('actionSelect');
const actionIntensity = document.getElementById('actionIntensity');
const intensityLabel = document.getElementById('intensityLabel');

// --- IndexedDB Persistence Implementation ---
const DB_NAME = 'TalkingAvatarDB';
const STORE_NAME = 'avatarImages';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = (e) => reject(e.target.error);
  });
}

async function saveImageToDB(slotKey, blob) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(blob, slotKey);
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error('Error saving image to DB:', err);
  }
}

async function removeImageFromDB(slotKey) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(slotKey);
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.error('Error removing image from DB:', err);
  }
}

async function loadAllImagesFromDB() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    
    for (let slotKey of Object.keys(images)) {
      const request = store.get(slotKey);
      request.onsuccess = () => {
        if (request.result) {
          images[slotKey] = URL.createObjectURL(request.result);
        }
      };
    }
    tx.oncomplete = () => {
      updateAvatarDisplay();
      updateBackgroundDisplay();
    };
  } catch (err) {
    console.error('Error loading images from DB:', err);
  }
}

async function clearAllImages() {
  if (!confirm('Are you sure you want to clear all saved avatar images and background?')) return;
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => {
      Object.keys(images).forEach(k => images[k] = null);
      updateAvatarDisplay();
      updateBackgroundDisplay();
      alert('All saved avatar images and background have been cleared.');
    };
  } catch (err) {
    console.error('Error clearing DB:', err);
  }
}

// --- Image Management Interface ---
function triggerUpload(slotKey) {
  activeUploadSlot = slotKey;
  fileInput.value = '';
  fileInput.click();
}

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !activeUploadSlot) return;
  
  await saveImageToDB(activeUploadSlot, file);
  images[activeUploadSlot] = URL.createObjectURL(file);
  
  if (activeUploadSlot === 'bg') {
    updateBackgroundDisplay();
  } else {
    updateAvatarDisplay();
  }
};

async function clearSlot(slotKey) {
  await removeImageFromDB(slotKey);
  images[slotKey] = null;
  if (slotKey === 'bg') {
    updateBackgroundDisplay();
  } else {
    updateAvatarDisplay();
  }
}

// --- Background Display Engine ---
function updateBackgroundDisplay() {
  if (images.bg) {
    stageBg.style.backgroundImage = `url('${images.bg}')`;
    stageBg.style.display = 'block';
  } else {
    stageBg.style.backgroundImage = 'none';
    stageBg.style.display = 'none';
  }
}

// --- Frame Resolution Engine (Talking + Blinking Combination) ---
function updateAvatarDisplay() {
  let currentKey = 'slot1';
  if (!isBlinking && !isTalking) currentKey = 'slot1';
  else if (!isBlinking && isTalking) currentKey = 'slot2';
  else if (isBlinking && !isTalking) currentKey = 'slot3';
  else if (isBlinking && isTalking) currentKey = 'slot4';

  const activeURL = images[currentKey] || images['slot1'] || images['slot2'] || images['slot3'] || images['slot4'];

  if (activeURL) {
    avatar.src = activeURL;
    avatar.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    avatar.style.display = 'none';
    placeholder.style.display = 'block';
  }
}

// --- Independent Blinking System with Frequency Control ---
function scheduleBlink() {
  const baseInterval = Math.random() * 4500 + 2000;
  const currentInterval = baseInterval / blinkMultiplier;

  blinkTimeout = setTimeout(() => {
    isBlinking = true;
    updateAvatarDisplay();
    
    const blinkDuration = Math.random() * 80 + 100;
    setTimeout(() => {
      isBlinking = false;
      updateAvatarDisplay();
      scheduleBlink();
    }, blinkDuration);
  }, currentInterval);
}

// --- Action Dropdown & Dynamic Slider Configuration ---
function applyActionSettings(actionValue, sliderVal) {
  // Remove all current animation classes
  const animClasses = ['anim-regular-bounce', 'anim-excited-bounce', 'anim-sway', 'anim-tilt', 'anim-pulse', 'anim-float'];
  avatarContainer.classList.remove(...animClasses);

  if (actionValue === 'none') return;

  // Add the chosen animation class
  avatarContainer.classList.add(actionValue);

  // Configure intensity limits and CSS variables dynamically based on action type
  if (actionValue === 'anim-regular-bounce') {
    intensityLabel.textContent = 'Regular Bounce Height';
    avatarContainer.style.setProperty('--anim-intensity', `-${sliderVal}px`);
  } else if (actionValue === 'anim-excited-bounce') {
    intensityLabel.textContent = 'Excited Bounce Height';
    avatarContainer.style.setProperty('--anim-intensity', `-${sliderVal}px`);
  } else if (actionValue === 'anim-sway') {
    intensityLabel.textContent = 'Side Sway Angle';
    avatarContainer.style.setProperty('--anim-intensity', `${sliderVal}deg`);
  } else if (actionValue === 'anim-tilt') {
    intensityLabel.textContent = 'Head Tilt Angle';
    avatarContainer.style.setProperty('--anim-intensity', `${sliderVal}deg`);
  } else if (actionValue === 'anim-pulse') {
    intensityLabel.textContent = 'Pulse Zoom Scale';
    avatarContainer.style.setProperty('--anim-intensity', `${sliderVal / 100}`);
  } else if (actionValue === 'anim-float') {
    intensityLabel.textContent = 'Hover Distance';
    avatarContainer.style.setProperty('--anim-intensity', `${sliderVal}px`);
  }
}

actionSelect.onchange = e => {
  currentActiveAction = e.target.value;
  
  // Set sensible default slider values when switching actions
  if (currentActiveAction === 'anim-regular-bounce') { actionIntensity.min = 2; actionIntensity.max = 25; actionIntensity.value = 10; }
  else if (currentActiveAction === 'anim-excited-bounce') { actionIntensity.min = 15; actionIntensity.max = 50; actionIntensity.value = 30; }
  else if (currentActiveAction === 'anim-sway') { actionIntensity.min = 2; actionIntensity.max = 15; actionIntensity.value = 6; }
  else if (currentActiveAction === 'anim-tilt') { actionIntensity.min = 3; actionIntensity.max = 20; actionIntensity.value = 8; }
  else if (currentActiveAction === 'anim-pulse') { actionIntensity.min = 102; actionIntensity.max = 125; actionIntensity.value = 108; }
  else if (currentActiveAction === 'anim-float') { actionIntensity.min = 5; actionIntensity.max = 35; actionIntensity.value = 15; }

  applyActionSettings(currentActiveAction, Number(actionIntensity.value));
};

actionIntensity.oninput = e => {
  applyActionSettings(currentActiveAction, Number(e.target.value));
};

// --- UI Layout Modes (Avatar-Only vs Setup Mode) ---
function toggleAvatarMode(enabled) {
  if (enabled) {
    document.body.classList.add('hidden-mode');
    floatingToggle.style.display = 'block';
    modeToggleBtn.textContent = '⚙️ Setup Mode';
  } else {
    document.body.classList.remove('hidden-mode');
    floatingToggle.style.display = 'none';
    modeToggleBtn.textContent = '📱 Avatar Mode';
  }
}

modeToggleBtn.onclick = () => {
  const isHidden = document.body.classList.contains('hidden-mode');
  toggleAvatarMode(!isHidden);
};

floatingToggle.onclick = () => {
  toggleAvatarMode(false);
};

// --- Sliders Configuration ---
document.getElementById('sensitivity').oninput = e => {
  const v = Number(e.target.value);
  threshold = .11 - (v / 100) * .105;
};

document.getElementById('blinkSpeed').oninput = e => {
  const v = Number(e.target.value);
  blinkMultiplier = 0.2 + (v / 100) * 2.8;
};

document.getElementById('clearAllBtn').onclick = clearAllImages;

// --- Microphone Engine ---
async function startMic() {
  if (!images.slot1 && !images.slot2 && !images.slot3 && !images.slot4) {
    alert('Please load at least one avatar image frame first.');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Microphone access is not supported or restricted. Ensure you are using HTTPS.');
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    data = new Float32Array(analyser.fftSize);

    running = true;
    start.textContent = 'STOP MICROPHONE';
    status.textContent = 'LISTENING';
    
    scheduleBlink();
    loop();
  } catch (err) {
    alert('Microphone permission denied or unavailable: ' + err.message);
  }
}

function loop() {
  if (!running) return;

  analyser.getFloatTimeDomainData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
  const rms = Math.sqrt(sum / data.length);
  const display = Math.min(100, rms * 900);
  bar.style.width = display + '%';

  isTalking = rms > threshold;
  updateAvatarDisplay();
  
  status.textContent = isTalking ? 'TALKING' : 'LISTENING';
  status.style.color = isTalking ? '#63df83' : '#ccc';

  requestAnimationFrame(loop);
}

function stopMic() {
  running = false;
  if (blinkTimeout) clearTimeout(blinkTimeout);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioContext) audioContext.close();
  stream = null; audioContext = null; analyser = null; isBlinking = false; isTalking = false;
  
  bar.style.width = '0%';
  status.textContent = 'Stopped';
  status.style.color = '#ccc';
  start.textContent = 'START MICROPHONE';
  updateAvatarDisplay();
}

start.onclick = () => running ? stopMic() : startMic();

window.addEventListener('DOMContentLoaded', () => {
  loadAllImagesFromDB();
  // Initialize default active action settings
  applyActionSettings(currentActiveAction, Number(actionIntensity.value));
});
</script>
</body>
</html>
